; PlatformIO project for the ESP Browser Tool diagnostic firmware.
; Usage: pio run -e esp32dev   (or esp32s3 / esp32c3)

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_src_filter = +<esp32-diag/>
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

[env:esp32dev]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1

[env:esp32c3]
board = esp32-c3-devkitm-1
